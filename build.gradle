buildscript {
    repositories {
        mavenLocal()
        maven {
            allowInsecureProtocol = true
            url = 'http://localhost:31647/snapshots'
        }
        maven { url = 'https://repo.spongepowered.org/maven' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.42'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'java'
apply plugin: 'org.spongepowered.mixin'

java {
    sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = JavaVersion.VERSION_1_8
}

//Forge
minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    accessTransformer 'src/main/resources/META-INF/fipixelmon_at.cfg'
}

group = 'com.fipixelmonmod.fipixelmon.FIPixelmon'
version = '1.3.0-STABLE'
def modid = 'fipixelmon'

configurations {
    bundle {
        canBeConsumed = false
        canBeResolved = true
    }

    compileClasspath.extendsFrom bundle
    runtimeClasspath.extendsFrom bundle
}

//depend
repositories {
    mavenCentral()
    mavenLocal()
    maven {
        allowInsecureProtocol = true
        url "http://localhost:31647/snapshots"
    }
    maven { url "https://maven.cleanroommc.com" }

    flatDir {
        dirs 'lib'
    }
}

dependencies {
    //minecraft
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'

    //宝可梦
    compileOnly fg.deobf('com.pixelmonmod.pixelmon:Pixelmon:1.12.2-8.4.3')

    bundle "jdk.nashorn.api:nashorn:1.0.0"

    //mixin
    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    implementation('zone.rong:mixinbooter:9.4') {
        transitive = false
    }
    annotationProcessor('zone.rong:mixinbooter:9.4') {
        transitive = false
    }

    //test
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    //lombok
    compileOnly 'org.projectlombok:lombok:1.18.28'
    annotationProcessor 'org.projectlombok:lombok:1.18.28'
}
//some setting
test {
    useJUnitPlatform()
}
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

processResources {
    filteringCharset 'UTF-8'
    filesMatching('mcmod.info') {
        expand project.properties
    }
}

//mixin
mixin {
    add sourceSets.main, "mixins.${modid}.refmap.json"
    config "mixins.${modid}.json"
}


//pack
jar.finalizedBy('reobfJar')

jar {
    manifest {
        attributes([
                "Specification-Title"        : "fipixelmon",
                "Specification-Version"      : "1",
                "Implementation-Title"       : project.name,
                "Implementation-Version"     : "${version}",
                "Implementation-Timestamp"   : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "FMLCorePlugin"              : "com.fipixelmonmod.fipixelmon.CorePlugin",
                "FMLCorePluginContainsFMLMod": true
        ])
    }

    from {
        configurations.bundle.collect {
            it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}